apiVersion: v1
kind: Service
metadata:
  name: postgres-svc          # DNS name: postgres-svc.three-tier-app.svc.cluster.local
  namespace: three-tier-app
  labels:
    app: postgres
    tier: database
spec:
  clusterIP: None             # Makes this a Headless Service
  ports:
    - port: 5432              # Port exposed by the service
      targetPort: 5432        # Port on the pod
      protocol: TCP
  selector:
    app: postgres             # Routes traffic to pods with this label