apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory  # Production Let's Encrypt
    email: rahul@example.com           
    privateKeySecretRef:
      name: letsencrypt-prod-key      # Stores ACME account private key
    solvers:
      - http01:
          ingress:
            class: traefik            # Uses built-in Traefik 