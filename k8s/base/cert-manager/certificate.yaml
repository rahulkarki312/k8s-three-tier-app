apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: three-tier-tls
  namespace: three-tier-app
spec:
  secretName: tls-secret             # Where cert+key are stored
  duration: 2160h                    # 90 days
  renewBefore: 360h                  # Renew 15 days before expiry
  subject:
    organizations:
      - Three Tier App Inc
  commonName: three-tier-app.example.com  # Your real domain
  dnsNames:
    - three-tier-app.example.com
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer