apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: three-tier-app
  labels:
    app: frontend
    tier: web
spec:
  replicas: 2                        # Two instances for redundancy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: web
    spec:
      containers:
        - name: frontend
          image: rahulkarki312/three-tier-frontend:17
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3001"   # <-- Explicitly overrides PORT="3000" from app-config
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: app-config        # Loads API_URL=http://backend-svc:3000
          resources:
            requests:
              memory: "64Mi"            # Frontend needs less memory
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz            # Frontend simpler than backend
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false