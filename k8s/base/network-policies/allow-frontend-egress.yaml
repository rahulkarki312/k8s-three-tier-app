apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-egress
  namespace: three-tier-app
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Egress
  egress:
    # Rule 1: Allow DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Rule 2: Allow traffic to backend API
    - to:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 3000
          protocol: TCP