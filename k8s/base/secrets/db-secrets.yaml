apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
  namespace: three-tier-app
  labels:
    app: three-tier-app
    component: database
type: Opaque
data:
  # Base64 encoded values (echo -n "value" | base64)
  DB_USER: YXBwdXNlcg==           # appuser
  DB_PASSWORD: YXBwcGFzc3dvcmQ=   # apppassword
  POSTGRES_USER: YXBwdXNlcg==     # appuser
  POSTGRES_PASSWORD: YXBwcGFzc3dvcmQ=  # apppassword